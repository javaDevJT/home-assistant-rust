[workspace]
resolver = "2"
exclude = ["vendor/mdns-sd"]
members = [
    "crates/hass-core", "crates/hass-storage", "crates/hass-automation",
    "crates/hass-api", "crates/hass", "crates/hass-registry", "crates/hass-auth",
    "crates/hass-template", "crates/hass-script", "crates/hass-mqtt",
    "crates/hass-native", "crates/hass-config", "crates/hass-rest",
    "crates/hass-template-entities", "crates/hass-group", "crates/hass-notifications",
    "crates/hass-zone", "crates/hass-person", "crates/hass-device-tracker",
    "crates/hass-image-upload", "crates/hass-webhook", "crates/hass-entity",
    "crates/hass-system-sensors", "crates/hass-tag", "crates/hass-logger",
    "crates/hass-sun", "crates/hass-system-log", "crates/hass-repairs",
    "crates/hass-system-health",
    "crates/hass-ssdp",
    "crates/hass-network",
    "crates/hass-zeroconf",
    "crates/hass-dhcp",
    "crates/hass-dhcp-wire",
    "crates/hass-dhcp-discover",
    "crates/hass-usb",
    "crates/hass-usb-backend",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/javaDevJT/home-assistant-rust"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws", "json", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hass-core = { path = "crates/hass-core" }
hass-storage = { path = "crates/hass-storage" }
hass-automation = { path = "crates/hass-automation" }
hass-api = { path = "crates/hass-api" }
hass-registry = { path = "crates/hass-registry" }
hass-auth = { path = "crates/hass-auth" }
hass-template = { path = "crates/hass-template" }
hass-script = { path = "crates/hass-script" }
hass-mqtt = { path = "crates/hass-mqtt" }
hass-native = { path = "crates/hass-native" }
hass-config = { path = "crates/hass-config" }
hass-rest = { path = "crates/hass-rest" }
hass-template-entities = { path = "crates/hass-template-entities" }
hass-group = { path = "crates/hass-group" }
hass-notifications = { path = "crates/hass-notifications" }
hass-zone = { path = "crates/hass-zone" }
hass-person = { path = "crates/hass-person" }
hass-device-tracker = { path = "crates/hass-device-tracker" }
hass-image-upload = { path = "crates/hass-image-upload" }
hass-webhook = { path = "crates/hass-webhook" }
hass-entity = { path = "crates/hass-entity" }
hass-system-sensors = { path = "crates/hass-system-sensors" }
hass-tag = { path = "crates/hass-tag" }
hass-logger = { path = "crates/hass-logger" }
hass-sun = { path = "crates/hass-sun" }
hass-system-log = { path = "crates/hass-system-log" }
hass-repairs = { path = "crates/hass-repairs" }
hass-system-health = { path = "crates/hass-system-health" }
hass-ssdp = { path = "crates/hass-ssdp" }
hass-network = { path = "crates/hass-network" }
hass-zeroconf = { path = "crates/hass-zeroconf" }
hass-dhcp = { path = "crates/hass-dhcp" }
hass-dhcp-wire = { path = "crates/hass-dhcp-wire" }
hass-dhcp-discover = { path = "crates/hass-dhcp-discover" }
hass-usb = { path = "crates/hass-usb" }
hass-usb-backend = { path = "crates/hass-usb-backend" }
idna = "=1.1.0"
pnet_datalink = "=0.35.0"
stringprep = "=0.1.5"
mdns-sd = { path = "vendor/mdns-sd" }
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png"] }
encoding_rs = "0.8"
indexmap = "2"
if-addrs = "0.15"
http-body-util = "0.1"
ipnet = "2"
jsonwebtoken = "9"
log = "0.4"
minijinja = { version = "2", features = ["fuel", "json", "builtins"] }
md-5 = "=0.10.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
regex = "1"
roxmltree = "0.21.2"
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_path_to_error = "0.1"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "=0.6.11", features = ["fs"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
